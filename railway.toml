[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c \"python -m uvicorn pramagent.api.app:app --host 0.0.0.0 --port ${PORT:-8080} --log-level ${PRAMAGENT_LOG_LEVEL:-info} --timeout-graceful-shutdown 30\""
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
