# Pramagent - pilot docker-compose
# ─────────────────────────────────────────────────────────────────────────────
# Services:
#   postgres  - audit store + hash chain persistence
#   redis     - HITL signalling, rate-limit buckets, session memory
#   api       - Pramagent FastAPI sidecar (trust pipeline)
#   dashboard - lightweight admin UI (trace browser, approvals, metrics)
#
# Quick start:
#   cp .env.example .env   # fill in secrets
#   docker compose up -d
#   open http://localhost:8080/docs       # OpenAPI
#   open http://localhost:8501/          # Dashboard
# ─────────────────────────────────────────────────────────────────────────────

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── Postgres ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pramagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-pramagent}
      # Consumed by init.sh to create the non-superuser app role the API
      # actually connects as (POSTGRES_USER is a superuser and would make
      # the pramagent_traces RLS policy a no-op).
      PRAMAGENT_APP_DB_PASSWORD: ${PRAMAGENT_APP_DB_PASSWORD:?PRAMAGENT_APP_DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    # internal-only: never published to the host (P1-10/T2-9)
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pramagent} -d ${POSTGRES_DB:-pramagent}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      # consumed by the healthcheck inside the container ($$REDIS_PASSWORD)
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    # internal-only: never published to the host (P1-10/T2-9)
    expose:
      - "6379"
    healthcheck:
      # $$ defers expansion to the container shell so the password is read
      # from the environment at run time, not baked into the inspectable
      # healthcheck command line
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 384m
    cpus: 0.5
    logging: *default-logging

  # ── Pramagent API ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PRAMAGENT_HOST: "0.0.0.0"
      PRAMAGENT_PORT: "8080"
      PRAMAGENT_LOG_LEVEL: ${PRAMAGENT_LOG_LEVEL:-info}
      PRAMAGENT_REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      # Store priority: PRAMAGENT_POSTGRES_DSN > PRAMAGENT_DB > opt-in memory.
      # The API refuses to start without one of the three (P0-1), so this DSN
      # is what makes the stack actually persist traces + the audit chain.
      # Connects as pramagent_app (see deploy/postgres/init.sh), not
      # POSTGRES_USER: POSTGRES_USER is a superuser and would silently defeat
      # the pramagent_traces row-level-security policy PostgresStore's DDL
      # sets up (superusers bypass RLS regardless of FORCE).
      PRAMAGENT_POSTGRES_DSN: "postgresql://pramagent_app:${PRAMAGENT_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-pramagent}"
      PRAMAGENT_API_KEY: ${PRAMAGENT_API_KEY:?PRAMAGENT_API_KEY is required}
      PRAMAGENT_API_KEYS: "default:${PRAMAGENT_API_KEY}"
      PRAMAGENT_SIGNING_KEY: ${PRAMAGENT_SIGNING_KEY:?PRAMAGENT_SIGNING_KEY is required}
      PRAMAGENT_JWT_SECRET: ${PRAMAGENT_JWT_SECRET:?PRAMAGENT_JWT_SECRET is required}
      PRAMAGENT_MAX_INPUT_BYTES: ${PRAMAGENT_MAX_INPUT_BYTES:-65536}
      PRAMAGENT_RATE_LIMIT_CAPACITY: ${PRAMAGENT_RATE_LIMIT_CAPACITY:-100}
      PRAMAGENT_RATE_LIMIT_REFILL: ${PRAMAGENT_RATE_LIMIT_REFILL:-10}
      PRAMAGENT_RATE_BURST: ${PRAMAGENT_RATE_LIMIT_CAPACITY:-100}
      PRAMAGENT_RATE_PER_SEC: ${PRAMAGENT_RATE_LIMIT_REFILL:-10}
      PRAMAGENT_AUTH_LOCKOUT_THRESHOLD: ${PRAMAGENT_AUTH_LOCKOUT_THRESHOLD:-10}
      PRAMAGENT_AUTH_LOCKOUT_WINDOW_S: ${PRAMAGENT_AUTH_LOCKOUT_WINDOW_S:-300}
      PRAMAGENT_AUTH_LOCKOUT_BASE_S: ${PRAMAGENT_AUTH_LOCKOUT_BASE_S:-30}
      PRAMAGENT_AUTH_LOCKOUT_MAX_S: ${PRAMAGENT_AUTH_LOCKOUT_MAX_S:-900}
      PRAMAGENT_AUTH_LOCKOUT_REDIS_URL: ${PRAMAGENT_AUTH_LOCKOUT_REDIS_URL:-}
      PRAMAGENT_QUOTA_CALLS: ${PRAMAGENT_QUOTA_CALLS:-}
      PRAMAGENT_QUOTA_TOOL_VALIDATIONS: ${PRAMAGENT_QUOTA_TOOL_VALIDATIONS:-}
      PRAMAGENT_QUOTA_COST_USD: ${PRAMAGENT_QUOTA_COST_USD:-}
      PRAMAGENT_QUOTA_WINDOW_S: ${PRAMAGENT_QUOTA_WINDOW_S:-86400}
      PRAMAGENT_BILLING_WEBHOOK_URL: ${PRAMAGENT_BILLING_WEBHOOK_URL:-}
      PRAMAGENT_BILLING_WEBHOOK_SECRET: ${PRAMAGENT_BILLING_WEBHOOK_SECRET:-}
      PRAMAGENT_BILLING_WEBHOOK_TIMEOUT_S: ${PRAMAGENT_BILLING_WEBHOOK_TIMEOUT_S:-2.0}
      PRAMAGENT_HITL_SLACK_TOKEN: ${PRAMAGENT_HITL_SLACK_TOKEN:-}
      PRAMAGENT_HITL_SLACK_CHANNEL: ${PRAMAGENT_HITL_SLACK_CHANNEL:-}
      PRAMAGENT_OTEL_ENDPOINT: ${PRAMAGENT_OTEL_ENDPOINT:-}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging

  # ── Dashboard ──────────────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: deploy/dashboard/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PRAMAGENT_API_URL: "http://api:8080"
      PRAMAGENT_API_KEY: ${PRAMAGENT_API_KEY}
      PRAMAGENT_DASHBOARD_REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/1"
      PRAMAGENT_DASHBOARD_KEY: ${PRAMAGENT_DASHBOARD_KEY:?PRAMAGENT_DASHBOARD_KEY is required}
      # Finding 1.1: the dashboard signs its sessions with a secret DISTINCT
      # from the API's PRAMAGENT_JWT_SECRET so an API-minted token can never
      # authenticate a dashboard session. PRAMAGENT_JWT_SECRET is still passed
      # only for the startup strength-check; DASHBOARD sessions use the value
      # below. These MUST be different values.
      PRAMAGENT_JWT_SECRET: ${PRAMAGENT_JWT_SECRET:?PRAMAGENT_JWT_SECRET is required}
      PRAMAGENT_DASHBOARD_JWT_SECRET: ${PRAMAGENT_DASHBOARD_JWT_SECRET:?PRAMAGENT_DASHBOARD_JWT_SECRET is required and must differ from PRAMAGENT_JWT_SECRET}
      PRAMAGENT_DASHBOARD_TENANT: ${PRAMAGENT_DASHBOARD_TENANT:-default}
      PRAMAGENT_DASHBOARD_ALLOW_SUPER_ADMIN: ${PRAMAGENT_DASHBOARD_ALLOW_SUPER_ADMIN:-false}
      # Default true, matching the app-level default — this compose file
      # must not silently override that back to false for anyone who leaves
      # it unset in .env.
      PRAMAGENT_DASHBOARD_SECURE_COOKIE: ${PRAMAGENT_DASHBOARD_SECURE_COOKIE:-true}
      PRAMAGENT_DASHBOARD_ALLOW_SHARED_KEY_LOGIN: ${PRAMAGENT_DASHBOARD_ALLOW_SHARED_KEY_LOGIN:-false}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8501}
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging

  # ── Postgres backup (opt-in) ─────────────────────────────────────────────
  # Scheduled pg_dump -> object storage, closing the "no backup automation"
  # gap. Off by default so existing deployments aren't forced to configure
  # S3 before `docker compose up` — enable with:
  #   docker compose --profile backup up -d
  backup:
    profiles: ["backup"]
    build:
      context: .
      dockerfile: deploy/postgres/Dockerfile.backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PRAMAGENT_POSTGRES_DSN: "postgresql://pramagent_app:${PRAMAGENT_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-pramagent}"
      # Soft default here, not `:?required` — compose validates every
      # service's interpolation on every `docker compose up`, even ones
      # gated by an inactive profile, so a hard requirement on an opt-in
      # service would break the default (no --profile) stack for everyone.
      # backup.py's own _require_env() enforces this for real once the
      # profile is actually enabled and the container runs.
      PRAMAGENT_BACKUP_S3_BUCKET: ${PRAMAGENT_BACKUP_S3_BUCKET:-}
      PRAMAGENT_BACKUP_S3_PREFIX: ${PRAMAGENT_BACKUP_S3_PREFIX:-pramagent/backups}
      PRAMAGENT_BACKUP_RETENTION_DAYS: ${PRAMAGENT_BACKUP_RETENTION_DAYS:-30}
      PRAMAGENT_BACKUP_KMS_KEY_ID: ${PRAMAGENT_BACKUP_KMS_KEY_ID:-}
      PRAMAGENT_BACKUP_INTERVAL_S: ${PRAMAGENT_BACKUP_INTERVAL_S:-3600}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          python backup.py || echo "backup run failed, will retry next interval" >&2
          sleep "$$PRAMAGENT_BACKUP_INTERVAL_S"
        done
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging

  # ── Audit-chain tamper detection (opt-in) ────────────────────────────────
  # Runs `pramagent audit-verify-watch` on a loop, closing the "detection is
  # entirely manual" gap. Reuses the api image/build (the CLI ships in the
  # same package) rather than a separate Dockerfile. Enable with:
  #   docker compose --profile audit-watch up -d
  audit-watch:
    profiles: ["audit-watch"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PRAMAGENT_POSTGRES_DSN: "postgresql://pramagent_app:${PRAMAGENT_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-pramagent}"
      PRAMAGENT_AUDIT_ALERT_WEBHOOK_URL: ${PRAMAGENT_AUDIT_ALERT_WEBHOOK_URL:-}
      PRAMAGENT_AUDIT_ALERT_WEBHOOK_SECRET: ${PRAMAGENT_AUDIT_ALERT_WEBHOOK_SECRET:-}
      PRAMAGENT_AUDIT_ALERT_TIMEOUT_S: ${PRAMAGENT_AUDIT_ALERT_TIMEOUT_S:-5.0}
      PRAMAGENT_AUDIT_WATCH_INTERVAL_S: ${PRAMAGENT_AUDIT_WATCH_INTERVAL_S:-900}
    entrypoint:
      - sh
      - -c
      - 'pramagent audit-verify-watch --interval-s "$$PRAMAGENT_AUDIT_WATCH_INTERVAL_S"'
    mem_limit: 256m
    cpus: 0.25
    logging: *default-logging

  # ── Scheduled retention pruning (opt-in) ─────────────────────────────────
  # Runs `pramagent retention-prune` on a loop instead of leaving it purely
  # manual/external-cron. Scoped to ONE tenant per instance (retention-prune
  # refuses unscoped pruning by design) — for multi-tenant deployments, run
  # one instance per tenant (e.g. via `docker compose run` from an external
  # per-tenant scheduler) rather than trying to loop tenants here. Enable
  # with: docker compose --profile retention-prune up -d
  retention-prune:
    profiles: ["retention-prune"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PRAMAGENT_POSTGRES_DSN: "postgresql://pramagent_app:${PRAMAGENT_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-pramagent}"
      PRAMAGENT_RETENTION_TENANT_ID: ${PRAMAGENT_RETENTION_TENANT_ID:-}
      PRAMAGENT_RETENTION_DAYS: ${PRAMAGENT_RETENTION_DAYS:-365}
      PRAMAGENT_RETENTION_INTERVAL_S: ${PRAMAGENT_RETENTION_INTERVAL_S:-86400}
    entrypoint:
      - sh
      - -c
      - |
        if [ -z "$$PRAMAGENT_RETENTION_TENANT_ID" ]; then
          echo "PRAMAGENT_RETENTION_TENANT_ID is required for the retention-prune profile" >&2
          exit 1
        fi
        pramagent retention-prune --tenant-id "$$PRAMAGENT_RETENTION_TENANT_ID" \
          --days "$$PRAMAGENT_RETENTION_DAYS" --interval-s "$$PRAMAGENT_RETENTION_INTERVAL_S"
    mem_limit: 256m
    cpus: 0.25
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
